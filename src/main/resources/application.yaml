spring:
  application:
    name: expense-tracker-api

  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update        # use 'validate' or 'none' in production; manage schema via Flyway/Liquibase instead
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Optional: if you add Flyway for migrations later
  # flyway:
  #   enabled: true
  #   locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_AT_LEAST_256_BITS
  expiration-ms: 86400000